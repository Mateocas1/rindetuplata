name: Java tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "capture/**"
      - "odd/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "capture/**"
      - "odd/**"
      - "**.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers uses the runner's Docker daemon for postgres:18-alpine.
      - run: ./mvnw -B test
