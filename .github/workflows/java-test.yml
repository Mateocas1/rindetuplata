name: Java tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "capture/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "capture/**"
      - "**.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers uses the runner's Docker daemon for postgres:18-alpine.
      - run: ./mvnw -B test
