# Test-only defaults: classpath:/config/application.properties is loaded in addition to
# classpath:/application.properties, so this file overrides only these keys and never shadows the main one.
# A test context must never try to reach a broker: the RabbitMQ tests (alert delivery, consumer, topology,
# dead letter) turn the relay and the consumer on explicitly in their @SpringBootTest properties.
rindetuplata.outbox.relay-enabled=false
rindetuplata.outbox.consumer-enabled=false
# The shared account test context posts far more magic links from one address than the production default allows.
rindetuplata.auth.magic-link-per-ip-limit=100000
# The shared API and account test contexts send far more public reads from one address, with a frozen clock that never
# refills a bucket, than the production default allows (ApiRateLimitApiTest sets its own tiny capacity).
rindetuplata.api.rate-limit.capacity=1000000
