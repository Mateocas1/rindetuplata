# Each test context owns its Testcontainers (Postgres, RabbitMQ) and keeps them alive while it stays cached.
# Spring's default cache holds 32 contexts, which left 22 Postgres and 5 RabbitMQ containers running at once and
# made Docker refuse fresh connections on a small machine (T11). An evicted context closes and stops its containers.
spring.test.context.cache.maxSize=8
