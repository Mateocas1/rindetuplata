spring.application.name=rindetuplata

# External data sources (T3). Timeouts are Spring durations.
rindetuplata.sources.connect-timeout=5s
rindetuplata.sources.read-timeout=15s
rindetuplata.sources.user-agent=rindetuplata (+https://github.com/Mateocas1/rindetuplata)
rindetuplata.sources.bcra-transparency-url=https://api.bcra.gob.ar/transparencia/v1.0
rindetuplata.sources.bcra-statistics-url=https://api.bcra.gob.ar/estadisticas/v4.0
rindetuplata.sources.argentina-datos-url=https://api.argentinadatos.com/v1/finanzas
rindetuplata.sources.dolar-api-url=https://dolarapi.com/v1
rindetuplata.sources.uala-url=https://www.uala.com.ar
rindetuplata.sources.macro-limit=24

# Spring Batch (T4): metadata tables come from the Flyway migration V2, and jobs are launched by our scheduler.
spring.batch.jdbc.initialize-schema=never
spring.batch.job.enabled=false

# Daily ingestion (T4c). The placeholder values feed @Scheduled; the record defaults are the same.
rindetuplata.ingest.enabled=true
rindetuplata.ingest.cron=0 30 19 * * *
rindetuplata.ingest.zone=America/Argentina/Buenos_Aires
# A checkout of the T9 data branch: raw/yyyy/MM/dd/manifest.json lives under it.
rindetuplata.ingest.archive-dir=archive

# Rebuild hook (T4d, S16): deploy hook of the static site, POSTed once after a COMPLETED ingestion. An empty value
# disables it; the timeout applies to both connect and read.
rindetuplata.ingest.rebuild-hook-url=
rindetuplata.ingest.rebuild-hook-timeout=10s
