spring.application.name=rindetuplata

# Deployment (T7a, S16): Caddy terminates TLS in front of the API, so Tomcat trusts the private-network proxy and
# reads X-Forwarded-Proto. Without this, a forwarded HTTPS request is not seen as secure and the XSRF-TOKEN cookie
# would not be Secure.
server.forward-headers-strategy=native

# External data sources (T3). Timeouts are Spring durations.
rindetuplata.sources.connect-timeout=5s
rindetuplata.sources.read-timeout=15s
rindetuplata.sources.user-agent=rindetuplata (+https://github.com/Mateocas1/rindetuplata)
rindetuplata.sources.bcra-transparency-url=https://api.bcra.gob.ar/transparencia/v1.0
rindetuplata.sources.bcra-statistics-url=https://api.bcra.gob.ar/estadisticas/v4.0
rindetuplata.sources.argentina-datos-url=https://api.argentinadatos.com/v1/finanzas
rindetuplata.sources.dolar-api-url=https://dolarapi.com/v1
rindetuplata.sources.uala-url=https://www.uala.com.ar
rindetuplata.sources.macro-limit=24

# Spring Batch (T4): metadata tables come from the Flyway migration V2, and jobs are launched by our scheduler.
spring.batch.jdbc.initialize-schema=never
spring.batch.job.enabled=false

# Daily ingestion (T4c). The placeholder values feed @Scheduled; the record defaults are the same.
rindetuplata.ingest.enabled=true
rindetuplata.ingest.cron=0 30 19 * * *
rindetuplata.ingest.zone=America/Argentina/Buenos_Aires
# A checkout of the T9 data branch: raw/yyyy/MM/dd/manifest.json lives under it.
rindetuplata.ingest.archive-dir=archive

# Rebuild hook (T4d, S16): deploy hook of the static site, POSTed once after a COMPLETED ingestion. An empty value
# disables it; the timeout applies to both connect and read.
rindetuplata.ingest.rebuild-hook-url=
rindetuplata.ingest.rebuild-hook-timeout=10s

# Users and magic-link login (T6a, S13). The link points at the frontend page that POSTs the token back.
rindetuplata.auth.magic-link-url=http://localhost:4321/ingresar
rindetuplata.auth.token-ttl=15m
rindetuplata.auth.max-active-tokens=3
# Per-IP limit of POST /api/v1/auth/magic-link (T11a): a fixed window counted in memory, so it assumes the single API
# instance of S16. The address is Tomcat's remote address, resolved from X-Forwarded-For of the trusted proxy.
rindetuplata.auth.magic-link-per-ip-limit=10
rindetuplata.auth.magic-link-per-ip-window=1h
# Comma list of emails that get ROLE_ADMIN, compared after trim and lower case.
rindetuplata.auth.admin-emails=
# Local development runs over HTTP; the VPS sets this to true.
rindetuplata.auth.secure-cookie=false

# Browser rules (T6a): the origins allowed to call this API with credentials.
rindetuplata.web.allowed-origins=http://localhost:4321

# Mail (T6a): Mailpit listens on 1025 in the local Docker Compose stack (T6d).
rindetuplata.mail.from=rindetuplata <no-reply@rindetuplata.ar>
spring.mail.host=localhost
spring.mail.port=1025

# Sessions (T6a): V3 creates the tables of Spring Session JDBC; Flyway owns the schema.
spring.session.jdbc.initialize-schema=never

# Alert delivery (T6d, S4, S13): the relay publishes the alert outbox on a timer and the consumer both listens to
# the email queue and records what it already delivered. A test that never touches a broker sets both flags false.
rindetuplata.outbox.relay-enabled=true
rindetuplata.outbox.consumer-enabled=true
rindetuplata.outbox.relay-interval=5s
rindetuplata.outbox.relay-batch-size=50
rindetuplata.outbox.confirm-timeout=5s
# The relay leases a claimed row (longer than the confirm timeout) and gives up on a row after this many failures.
rindetuplata.outbox.lease=1m
rindetuplata.outbox.max-attempts=10
# The frontend page where the saver manages the alert rules (the same site the magic link points at).
rindetuplata.alert.manage-url=http://localhost:4321/alertas

# RabbitMQ delivery (T6d): the relay waits for the broker's publisher confirm before marking a row published.
spring.rabbitmq.publisher-confirm-type=correlated
# T11b: an unroutable message is acked by the broker but returned; the relay counts the return as a failure.
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
# The consumer retries a failed mail 3 times, then the message is dead-lettered instead of being requeued forever.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.default-requeue-rejected=false
