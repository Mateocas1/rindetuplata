spring.application.name=rindetuplata

# Deployment: Caddy terminates TLS in front of the API, so Tomcat trusts the private-network proxy and
# reads X-Forwarded-Proto. Without this, a forwarded HTTPS request is not seen as secure and the XSRF-TOKEN cookie
# would not be Secure.
server.forward-headers-strategy=native

# External data sources. Timeouts are Spring durations.
rindetuplata.sources.connect-timeout=5s
rindetuplata.sources.read-timeout=15s
rindetuplata.sources.user-agent=rindetuplata (+https://github.com/Mateocas1/rindetuplata)
rindetuplata.sources.bcra-transparency-url=https://api.bcra.gob.ar/transparencia/v1.0
rindetuplata.sources.bcra-statistics-url=https://api.bcra.gob.ar/estadisticas/v4.0
rindetuplata.sources.argentina-datos-url=https://api.argentinadatos.com/v1/finanzas
rindetuplata.sources.argentina-datos-cotizaciones-url=https://api.argentinadatos.com/v1/cotizaciones
rindetuplata.sources.dolar-api-url=https://dolarapi.com/v1
rindetuplata.sources.uala-url=https://www.uala.com.ar
rindetuplata.sources.macro-limit=24

# Spring Batch: metadata tables come from the Flyway migration V2, and jobs are launched by our scheduler.
spring.batch.jdbc.initialize-schema=never
spring.batch.job.enabled=false

# Daily ingestion. The placeholder values feed @Scheduled; the record defaults are the same.
rindetuplata.ingest.enabled=true
rindetuplata.ingest.cron=0 30 19 * * *
rindetuplata.ingest.zone=America/Argentina/Buenos_Aires
# A checkout of the data branch: raw/yyyy/MM/dd/manifest.json lives under it.
rindetuplata.ingest.archive-dir=archive
# Ingestion at startup: the cron above only fires at 19:30, so a stack that boots fresh would serve an
# empty ranking until then. True runs today's LIVE ingestion once, on a background thread, when the application is
# ready: HTTP and health are never delayed, a failure is logged and an already-completed day is a no-op.
rindetuplata.ingest.run-on-startup=false

# Ingestion health: the `ingestionFreshness` health contributor (its group is `ingestion`; Boot refuses
# a contributor and a group of one name) is UP while the newest successful LIVE ingestion
# is at most this long past the run the cron above was expected to make for its capture date (36h after the 19:30 run:
# one missed run is tolerated, two are not). Past that it is the custom status STALE.
rindetuplata.ingest.stale-after=36h
# STALE sits between DOWN and UP. On /actuator/health it is HTTP 200, so Docker's HEALTHCHECK, `depends_on:
# service_healthy` and Caddy keep working while the data is old; on the `ingestion` group it is 503, the URL an external
# monitor watches (/actuator/health/ingestion). The group exposes only that one contributor, with its details (last
# success date and age); the main endpoint still shows the bare status.
management.endpoint.health.status.order=down,out-of-service,stale,up,unknown
# Naming one mapping replaces Boot's defaults (DOWN and OUT_OF_SERVICE are 503 only by default), so all are spelled out.
management.endpoint.health.status.http-mapping.down=503
management.endpoint.health.status.http-mapping.out-of-service=503
management.endpoint.health.status.http-mapping.stale=200
management.endpoint.health.group.ingestion.include=ingestionFreshness
management.endpoint.health.group.ingestion.show-details=always
management.endpoint.health.group.ingestion.status.http-mapping.down=503
management.endpoint.health.group.ingestion.status.http-mapping.out-of-service=503
management.endpoint.health.group.ingestion.status.http-mapping.stale=503

# Rebuild hook: deploy hook of the static site, POSTed once after a COMPLETED ingestion. An empty value
# disables it; the timeout applies to both connect and read.
rindetuplata.ingest.rebuild-hook-url=
rindetuplata.ingest.rebuild-hook-timeout=10s

# Public read API: a token bucket per remote address on GET /api/v1/ranking, /simulations and
# /instruments/**, in memory, so it assumes the single API instance. The address comes from X-Forwarded-For of
# the trusted proxy. Over the limit the answer is a 429 ProblemDetail with Retry-After.
rindetuplata.api.rate-limit.capacity=120
rindetuplata.api.rate-limit.refill-per-second=2
# Upper bound of the buckets kept in memory. An IPv6 client counts as its /64 prefix (one bucket per subscriber), IPv4
# per address. At the cap a new address is refused with the same 429 after a sweep of full buckets (fail closed for
# unknown clients); addresses already tracked keep working.
rindetuplata.api.rate-limit.max-tracked-addresses=100000
# Optional: a request whose X-Build-Token header equals this value is not limited, so the static site build (hundreds
# of calls from one machine) never trips the limit. Blank disables the bypass. Set it from the environment
# (RINDETUPLATA_API_RATELIMIT_BYPASSTOKEN), never commit a value.
rindetuplata.api.rate-limit.bypass-token=

# API key plans: a request with a valid X-Api-Key on the public read API is limited by the plan of its key
# instead of the address: a token bucket per key (capacity, refill per second) and a quota of counted requests per
# Argentine day (America/Argentina/Buenos_Aires); a request the bucket refuses does not count. Plans: anonymous (no
# key) is the per-address bucket above; FREE is every key a user creates; PARTNER is set by the operator in SQL
# (docs/deploy.md). Buckets and quotas live in memory (single API instance): a restart resets the quotas.
rindetuplata.api.plans.free.capacity=600
rindetuplata.api.plans.free.refill-per-second=10
rindetuplata.api.plans.free.daily-quota=20000
rindetuplata.api.plans.partner.capacity=3000
rindetuplata.api.plans.partner.refill-per-second=50
rindetuplata.api.plans.partner.daily-quota=500000

# Public ranking cache: an in-process LRU of ranking results keyed by the data version and the resolved
# query. This is the most entries it ever holds; the least recently used one is evicted first. One entry is a whole
# ranking (up to a few hundred rows), so the cap is a memory bound more than a hit-rate knob.
rindetuplata.ranking.cache-max-entries=64

# Monthly report cache: an in-process LRU of the month list and of each closed month's report, keyed by the
# data version (and by today's date for the list). This is the most reports it ever holds; the least recently used
# one is evicted first.
rindetuplata.report.cache-max-entries=24

# History backfill: the polite delay between two calls to the dated FCI endpoint of one run.
rindetuplata.backfill.delay=500ms

# Users and magic-link login. The link points at the frontend page that POSTs the token back.
rindetuplata.auth.magic-link-url=http://localhost:4321/ingresar
rindetuplata.auth.token-ttl=15m
rindetuplata.auth.max-active-tokens=3
# Per-IP limit of POST /api/v1/auth/magic-link: a fixed window counted in memory, so it assumes the single API
# instance. The address is Tomcat's remote address, resolved from X-Forwarded-For of the trusted proxy.
rindetuplata.auth.magic-link-per-ip-limit=10
rindetuplata.auth.magic-link-per-ip-window=1h
# Comma list of emails that get ROLE_ADMIN, compared after trim and lower case.
rindetuplata.auth.admin-emails=
# Local development runs over HTTP; the VPS sets this to true.
rindetuplata.auth.secure-cookie=false

# Browser rules: the origins allowed to call this API with credentials.
rindetuplata.web.allowed-origins=http://localhost:4321

# Mail: Mailpit listens on 1025 in the local Docker Compose stack.
rindetuplata.mail.from=rindetuplata <no-reply@rindetuplata.ar>
spring.mail.host=localhost
spring.mail.port=1025

# Sessions: V3 creates the tables of Spring Session JDBC; Flyway owns the schema.
spring.session.jdbc.initialize-schema=never

# Alert delivery: the relay publishes the alert outbox on a timer and the consumer both listens to
# the email queue and records what it already delivered. A test that never touches a broker sets both flags false.
rindetuplata.outbox.relay-enabled=true
rindetuplata.outbox.consumer-enabled=true
rindetuplata.outbox.relay-interval=5s
rindetuplata.outbox.relay-batch-size=50
rindetuplata.outbox.confirm-timeout=5s
# The relay leases a claimed row (longer than the confirm timeout) and gives up on a row after this many failures.
rindetuplata.outbox.lease=1m
rindetuplata.outbox.max-attempts=10
# The frontend page where the saver manages the alert rules (the same site the magic link points at).
rindetuplata.alert.manage-url=http://localhost:4321/alertas

# RabbitMQ delivery: the relay waits for the broker's publisher confirm before marking a row published.
spring.rabbitmq.publisher-confirm-type=correlated
# An unroutable message is acked by the broker but returned; the relay counts the return as a failure.
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
# The consumer retries a failed mail 3 times, then the message is dead-lettered instead of being requeued forever.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.default-requeue-rejected=false
