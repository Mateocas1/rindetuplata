# The `prod` profile, set by deploy/compose.vps.yaml as SPRING_PROFILES_ACTIVE=prod.
#
# The local defaults in application.properties (HTTP, localhost, Mailpit, no admin) are right for development and
# wrong for a public host, and a forgotten override used to start silently. With this profile ProdProfileGuard
# (src/main/java/ar/rindetuplata/config) refuses to start, naming every offending property, when:
#   - rindetuplata.auth.secure-cookie is false;
#   - rindetuplata.web.allowed-origins, rindetuplata.auth.magic-link-url or rindetuplata.alert.manage-url is blank,
#     not https, or points at localhost;
#   - spring.mail.host is blank or localhost;
#   - rindetuplata.auth.admin-emails is blank;
#   - rindetuplata.api.rate-limit.bypass-token is set but shorter than 32 characters.
# The environment still supplies the real values; this file only changes the one default that must never be an opt-in.

# TLS terminates in front of the API on the VPS: the session and CSRF cookies are Secure unless someone says otherwise
# (and then the guard refuses to start).
rindetuplata.auth.secure-cookie=true
